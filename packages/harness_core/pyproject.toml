[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "harness-core"
version = "0.1.0"
description = "Core Intelligence Engine for HarnessX Adaptive Coding Agent Infrastructure"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "HarnessX Core Engine Team" }
]
dependencies = [
    "pydantic>=2.5.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
]
cloud = [
    "google-cloud-aiplatform>=1.40.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
